<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Human Model Auto-Rigging</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #instructions {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 10;
        }
        #model-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 2px solid white;
            border-radius: 5px;
            z-index: 10;
            overflow: hidden;
        }
        #file-upload {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        progress {
            width: 80%;
            margin-top: 20px;
        }
        #posenet-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Auto-Rigging System...</h2>
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="loading-status">Initializing components...</p>
    </div>
    
    <div id="instructions">
        <h3>Auto-Rigging Demo</h3>
        <p>Upload a non-rigged 3D character model below.</p>
        <p>PoseNet will analyze the model and automatically rig it.</p>
    </div>
    
    <div id="file-upload">
        <input type="file" id="model-input" accept=".glb,.gltf">
        <button id="analyze-btn" disabled>Analyze & Auto-Rig</button>
    </div>
    
    <div id="model-container"></div>
    
    <canvas id="posenet-canvas" width="320" height="240"></canvas>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js"
        }
    }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let scene, camera, renderer, controls;
        let model, skeleton, mixer, clock;
        let poseNet;
        let loadingManager, progressBar, loadingStatus;
        let userModel, userModelScene, userModelRenderer;
        let posenetCanvas, posenetCanvasCtx;
        let analyzeBtn = document.getElementById('analyze-btn');
        let uploadedModelFile = null;
        
        const boneMapping = {
            nose: "mixamorigHead",
            leftShoulder: "mixamorigLeftShoulder",
            rightShoulder: "mixamorigRightShoulder",
            leftElbow: "mixamorigLeftArm",
            rightElbow: "mixamorigRightArm",
            leftWrist: "mixamorigLeftForeArm",
            rightWrist: "mixamorigRightForeArm",
            leftHip: "mixamorigLeftUpLeg",
            rightHip: "mixamorigRightUpLeg",
            leftKnee: "mixamorigLeftLeg",
            rightKnee: "mixamorigRightLeg",
            leftAnkle: "mixamorigLeftFoot",
            rightAnkle: "mixamorigRightFoot"
        };
        
        const bonesRef = {};
        
        let poseNetLoaded = false;
        
        loadingManager = new THREE.LoadingManager();
        progressBar = document.getElementById('progress-bar');
        loadingStatus = document.getElementById('loading-status');
        
        loadingManager.onProgress = function(url, loaded, total) {
            const progress = (loaded / total) * 100;
            progressBar.value = progress;
            loadingStatus.textContent = `Loading 3D model: ${Math.round(progress)}%`;
        };
        
        loadingManager.onLoad = function() {
            if (poseNetLoaded) {
                document.getElementById('loading').style.display = 'none';
            }
        };
        
        document.getElementById('model-input').addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                uploadedModelFile = event.target.files[0];
                analyzeBtn.disabled = false;
                loadingStatus.textContent = "Model file selected. Click 'Analyze & Auto-Rig' to process.";
            }
        });
        
        analyzeBtn.addEventListener('click', function() {
            if (uploadedModelFile) {
                loadUserModel(uploadedModelFile);
            }
        });
        
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x282c34);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            camera = new THREE.PerspectiveCamera(
                45, window.innerWidth / window.innerHeight, 0.1, 1000
            );
            camera.position.set(0, 1.5, 3);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1, 0);
            controls.update();
            
            clock = new THREE.Clock();
            
            initUserModelScene();
            
            loadPoseNet();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function initUserModelScene() {
            posenetCanvas = document.getElementById('posenet-canvas');
            posenetCanvasCtx = posenetCanvas.getContext('2d');
            
            const container = document.getElementById('model-container');
            
            userModelScene = new THREE.Scene();
            userModelScene.background = new THREE.Color(0x444444);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            userModelScene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 2, 3);
            userModelScene.add(directionalLight);
            
            const aspect = container.clientWidth / container.clientHeight;
            const camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            camera.position.set(0, 1, 2.5);
            camera.lookAt(0, 1, 0);
            
            try {
                userModelRenderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });
                userModelRenderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(userModelRenderer.domElement);
            } catch (error) {
                console.error("WebGL context creation failed:", error);
                loadingStatus.textContent = "WebGL not supported in your browser or device. Please try another browser.";
                const errorMsg = document.createElement('div');
                errorMsg.innerHTML = "WebGL not available";
                errorMsg.style.color = "white";
                errorMsg.style.textAlign = "center";
                errorMsg.style.padding = "20px";
                container.innerHTML = '';
                container.appendChild(errorMsg);
            }
        }
        
        function loadUserModel(file) {
            loadingStatus.textContent = "Loading your 3D model...";
            document.getElementById('loading').style.display = 'flex';
            
            if (!userModelRenderer) {
                loadingStatus.textContent = "Cannot load model: WebGL not available on your device.";
                document.getElementById('loading').style.display = 'none';
                return;
            }
            
            const loader = new GLTFLoader(loadingManager);
            const fileURL = URL.createObjectURL(file);
            
            loader.load(fileURL, (gltf) => {
                if (userModel) {
                    userModelScene.remove(userModel);
                }
                
                userModel = gltf.scene;
                
                const bbox = new THREE.Box3().setFromObject(userModel);
                const center = bbox.getCenter(new THREE.Vector3());
                const size = bbox.getSize(new THREE.Vector3());
                
                userModel.position.x = -center.x;
                userModel.position.y = -center.y + size.y/2;
                userModel.position.z = -center.z;
                
                const scale = 1.5 / Math.max(size.x, size.y, size.z);
                userModel.scale.set(scale, scale, scale);
                
                userModelScene.add(userModel);
                
                userModelRenderer.render(userModelScene, camera);
                
                loadingStatus.textContent = "Analyzing model for auto-rigging...";
                setTimeout(() => detectPoseOnModel(), 500); 
                
                document.getElementById('loading').style.display = 'none';
            }, 
            (xhr) => {
            },
            (error) => {
                console.error('Error loading model:', error);
                loadingStatus.textContent = "Error loading your model. Please try another file.";
            });
        }
        
        function loadDefaultModel() {
            loadingStatus.textContent = "Loading 3D human model...";
            
            const loader = new GLTFLoader(loadingManager);
            
            const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Xbot.glb';
            
            loader.load(modelUrl, (gltf) => {
                model = gltf.scene;
                model.traverse(function(object) {
                    if (object.isMesh) {
                        object.castShadow = true;
                        object.receiveShadow = true;
                    }
                });
                
                skeleton = new THREE.SkeletonHelper(model);
                skeleton.visible = true;
                scene.add(skeleton);
                
                skeleton.bones.forEach(bone => {
                    bonesRef[bone.name] = bone;
                });
                
                mixer = new THREE.AnimationMixer(model);
                if (gltf.animations.length) {
                    const idleAction = mixer.clipAction(gltf.animations[0]);
                    idleAction.play();
                }
                
                const bbox = new THREE.Box3().setFromObject(model);
                const center = bbox.getCenter(new THREE.Vector3());
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;
                model.position.y = 0; 
                
                scene.add(model);
                
                loadingStatus.textContent = "Default model loaded. Ready for auto-rigging!";
            }, 
            (xhr) => {
            },
            (error) => {
                console.error('Error loading model:', error);
                loadingStatus.textContent = "Error loading model. Please refresh the page.";
            });
        }
        
        async function loadPoseNet() {
            loadingStatus.textContent = "Loading pose detection model...";
            
            try {
                poseNet = await posenet.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: { width: 320, height: 240 },
                    multiplier: 0.75,
                    quantBytes: 2
                });
                
                loadingStatus.textContent = "Pose detection model loaded!";
                poseNetLoaded = true;
                
                if (loadingManager.isLoaded) {
                    document.getElementById('loading').style.display = 'none';
                }
                
                loadDefaultModel();
            } catch (error) {
                console.error('Error loading PoseNet:', error);
                loadingStatus.textContent = "Error loading pose detection. Please refresh.";
            }
        }
        
        async function detectPoseOnModel() {
            if (!poseNet || !userModel) {
                return;
            }
            
            userModelRenderer.render(userModelScene, camera);
            
            posenetCanvasCtx.clearRect(0, 0, posenetCanvas.width, posenetCanvas.height);
            posenetCanvasCtx.drawImage(userModelRenderer.domElement, 
                0, 0, userModelRenderer.domElement.width, userModelRenderer.domElement.height,
                0, 0, posenetCanvas.width, posenetCanvas.height);
            
            try {
                const pose = await poseNet.estimateSinglePose(posenetCanvas, {
                    flipHorizontal: false
                });
                
                if (pose.score > 0.2) {
                    loadingStatus.textContent = "Pose detected! Auto-rigging in progress...";
                    console.log("Detected pose:", pose);
                    updateModelPose(pose);
                    
                    setTimeout(() => {
                        loadingStatus.textContent = "Auto-rigging complete!";
                        document.getElementById('loading').style.display = 'none';
                    }, 2000);
                } else {
                    loadingStatus.textContent = "Couldn't detect a clear pose. Try another model angle.";
                    userModel.rotation.y += Math.PI / 4;
                    setTimeout(() => detectPoseOnModel(), 500);
                }
            } catch (error) {
                console.error('Error in pose detection:', error);
                loadingStatus.textContent = "Error during pose analysis. Please try another model.";
            }
        }
        
        function updateModelPose(pose) {
            if (!model || !skeleton) return;
            
            const keypoints = {};
            pose.keypoints.forEach(keypoint => {
                if (keypoint.score > 0.5) { 
                    keypoints[keypoint.part] = {
                        x: keypoint.position.x / posenetCanvas.width - 0.5,
                        y: -(keypoint.position.y / posenetCanvas.height - 0.5)
                    };
                }
            });
            
            for (const [poseKey, boneName] of Object.entries(boneMapping)) {
                const bone = bonesRef[boneName];
                if (bone && keypoints[poseKey]) {
                    const offsetX = keypoints[poseKey].x * 2;
                    const offsetY = keypoints[poseKey].y * 2;
                    
                    if (poseKey.includes('Elbow') || poseKey.includes('Wrist')) {
                        bone.rotation.z = offsetX * Math.PI * 0.5;
                        bone.rotation.x = offsetY * Math.PI * 0.5;
                    } else if (poseKey.includes('Shoulder')) {
                        bone.rotation.z = offsetX * Math.PI * 0.25;
                        bone.rotation.x = offsetY * Math.PI * 0.25;
                    } else if (poseKey.includes('Hip') || poseKey.includes('Knee')) {
                        bone.rotation.z = offsetX * Math.PI * 0.1;
                        bone.rotation.x = offsetY * Math.PI * 0.1;
                    }
                }
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }
            
            if (userModel && userModelRenderer) {
                userModel.rotation.y += 0.01;
                userModelRenderer.render(userModelScene, camera);
            }
            
            renderer.render(scene, camera);
        }
        
        function init() {
            initScene();
            animate();
        }
        
        init();
    </script>
