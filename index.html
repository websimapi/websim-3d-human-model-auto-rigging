<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Human Model Auto-Rigging</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #instructions {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 10;
        }
        #file-upload-container {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
        #reference-model {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 2px solid white;
            border-radius: 5px;
            z-index: 10;
            background-color: #333;
        }
        progress {
            width: 80%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Auto-Rigging System...</h2>
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="loading-status">Initializing components...</p>
    </div>
    
    <div id="instructions">
        <h3>Auto-Rigging Demo</h3>
        <p>Upload your unrigged 3D character model (glTF/GLB format).</p>
        <p>The system will automatically rig and animate the model.</p>
    </div>

    <div id="file-upload-container">
        <input type="file" id="model-upload" accept=".glb,.gltf" />
        <button id="start-rigging">Start Auto-Rigging</button>
    </div>
    
    <div id="reference-model"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js",
            "@tensorflow-models/posenet": "https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Load TensorFlow and PoseNet
        // Note: These are loaded as script tags as they don't fully support ES modules
        let poseNetLoaded = false;
        
        // Global variables
        let scene, camera, renderer, controls;
        let userModel, skeleton, mixer, clock;
        let referenceModel, referenceRenderer, referenceScene, referenceCamera;
        let poseNet;
        let loadingManager, progressBar, loadingStatus;
        let animationRunning = false;
        
        // Bone mapping between PoseNet and model
        const boneMapping = {
            nose: "mixamorigHead",
            leftShoulder: "mixamorigLeftShoulder",
            rightShoulder: "mixamorigRightShoulder",
            leftElbow: "mixamorigLeftArm",
            rightElbow: "mixamorigRightArm",
            leftWrist: "mixamorigLeftForeArm",
            rightWrist: "mixamorigRightForeArm",
            leftHip: "mixamorigLeftUpLeg",
            rightHip: "mixamorigRightUpLeg",
            leftKnee: "mixamorigLeftLeg",
            rightKnee: "mixamorigRightLeg",
            leftAnkle: "mixamorigLeftFoot",
            rightAnkle: "mixamorigRightFoot"
        };
        
        const bonesRef = {};
        
        // Loading manager for tracking loading progress
        loadingManager = new THREE.LoadingManager();
        progressBar = document.getElementById('progress-bar');
        loadingStatus = document.getElementById('loading-status');
        
        loadingManager.onProgress = function(url, loaded, total) {
            const progress = (loaded / total) * 100;
            progressBar.value = progress;
            loadingStatus.textContent = `Loading 3D model: ${Math.round(progress)}%`;
        };
        
        loadingManager.onLoad = function() {
            if (poseNetLoaded) {
                document.getElementById('loading').style.display = 'none';
            }
        };
        
        // Initialize Three.js scene
        function initScene() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x282c34);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(
                45, window.innerWidth / window.innerHeight, 0.1, 1000
            );
            camera.position.set(0, 1.5, 3);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1, 0);
            controls.update();
            
            // Clock for animations
            clock = new THREE.Clock();
            
            // Initialize reference model scene
            initReferenceModelScene();
            
            // Setup model upload handler
            document.getElementById('model-upload').addEventListener('change', handleModelUpload);
            document.getElementById('start-rigging').addEventListener('click', startRigging);
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Load PoseNet
            loadPoseNet();
        }
        
        // Initialize reference model scene (animated character for pose source)
        function initReferenceModelScene() {
            // Create reference scene
            referenceScene = new THREE.Scene();
            referenceScene.background = new THREE.Color(0x333333);
            
            // Reference lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            referenceScene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            referenceScene.add(directionalLight);
            
            // Reference camera
            referenceCamera = new THREE.PerspectiveCamera(
                45, 160 / 120, 0.1, 1000
            );
            referenceCamera.position.set(0, 1.5, 3);
            
            // Reference renderer
            const container = document.getElementById('reference-model');
            referenceRenderer = new THREE.WebGLRenderer({ antialias: true });
            referenceRenderer.setSize(160, 120);
            container.appendChild(referenceRenderer.domElement);
            
            // Load animated reference model
            loadReferenceModel();
        }
        
        // Load the reference animated model (source for pose detection)
        function loadReferenceModel() {
            loadingStatus.textContent = "Loading reference model...";
            
            const loader = new GLTFLoader(loadingManager);
            const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Xbot.glb';
            
            loader.load(modelUrl, (gltf) => {
                referenceModel = gltf.scene;
                
                // Add animations to the reference model
                mixer = new THREE.AnimationMixer(referenceModel);
                if (gltf.animations.length) {
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
                
                // Center model
                const bbox = new THREE.Box3().setFromObject(referenceModel);
                const center = bbox.getCenter(new THREE.Vector3());
                referenceModel.position.x = -center.x;
                referenceModel.position.y = -center.y;
                referenceModel.position.z = -center.z;
                referenceModel.position.y = 0;
                
                referenceScene.add(referenceModel);
            });
        }
        
        // Handle user model upload
        function handleModelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            loadingStatus.textContent = "Loading your model...";
            document.getElementById('loading').style.display = 'flex';
            
            const loader = new GLTFLoader(loadingManager);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const contents = e.target.result;
                
                loader.parse(contents, '', (gltf) => {
                    // Remove any existing model
                    if (userModel) {
                        scene.remove(userModel);
                    }
                    if (skeleton) {
                        scene.remove(skeleton);
                    }
                    
                    userModel = gltf.scene;
                    userModel.traverse(function(object) {
                        if (object.isMesh) {
                            object.castShadow = true;
                            object.receiveShadow = true;
                        }
                    });
                    
                    // Center model
                    const bbox = new THREE.Box3().setFromObject(userModel);
                    const center = bbox.getCenter(new THREE.Vector3());
                    userModel.position.x = -center.x;
                    userModel.position.y = -center.y;
                    userModel.position.z = -center.z;
                    userModel.position.y = 0;
                    
                    scene.add(userModel);
                    
                    // Set up a basic skeleton for the model
                    setupSkeleton(userModel);
                    
                    document.getElementById('loading').style.display = 'none';
                }, undefined, function(error) {
                    console.error('Error parsing model:', error);
                    loadingStatus.textContent = "Error loading model. Please try another file.";
                });
            };
            
            reader.readAsArrayBuffer(file);
        }
        
        // Set up basic skeleton for the uploaded model
        function setupSkeleton(model) {
            // Create a skeleton helper to visualize
            skeleton = new THREE.SkeletonHelper(model);
            skeleton.visible = true;
            scene.add(skeleton);
            
            // Clear existing bone references
            Object.keys(bonesRef).forEach(key => delete bonesRef[key]);
            
            // Store references to bones for pose updating
            skeleton.bones.forEach(bone => {
                bonesRef[bone.name] = bone;
            });
        }
        
        // Start the auto-rigging process
        function startRigging() {
            if (!userModel || !skeleton) {
                alert("Please upload a model first.");
                return;
            }
            
            if (!poseNetLoaded) {
                alert("PoseNet is still loading. Please wait.");
                return;
            }
            
            animationRunning = true;
            detectPose();
        }
        
        // Load PoseNet model
        async function loadPoseNet() {
            loadingStatus.textContent = "Loading pose detection model...";
            
            try {
                // Global scope is needed as posenet is loaded via script tag
                poseNet = await posenet.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: { width: 160, height: 120 },
                    multiplier: 0.75,
                    quantBytes: 2
                });
                
                loadingStatus.textContent = "All components loaded!";
                poseNetLoaded = true;
                
                // Hide loading screen if model is also loaded
                if (loadingManager.isLoaded) {
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading PoseNet:', error);
                loadingStatus.textContent = "Error loading pose detection. Please refresh.";
            }
        }
        
        // Run pose detection on the reference model
        async function detectPose() {
            if (!poseNetLoaded || !referenceRenderer || !animationRunning) {
                return;
            }
            
            try {
                // Render reference model to a canvas
                referenceRenderer.render(referenceScene, referenceCamera);
                const canvas = referenceRenderer.domElement;
                
                // Use PoseNet to detect pose from the rendered reference model
                const pose = await poseNet.estimateSinglePose(canvas);
                
                // Update user model pose if confidence is high enough
                if (pose.score > 0.2) {
                    updateModelPose(pose);
                }
            } catch (error) {
                console.error('Error in pose detection:', error);
            }
            
            if (animationRunning) {
                requestAnimationFrame(detectPose);
            }
        }
        
        // Update the user's 3D model based on detected pose
        function updateModelPose(pose) {
            if (!userModel || !skeleton) return;
            
            // Normalize keypoints
            const keypoints = {};
            pose.keypoints.forEach(keypoint => {
                if (keypoint.score > 0.5) { // Only use high-confidence points
                    keypoints[keypoint.part] = {
                        x: keypoint.position.x / 160 - 0.5,
                        y: -(keypoint.position.y / 120 - 0.5)
                    };
                }
            });
            
            // Apply calculated rotations to model bones
            for (const [poseKey, boneName] of Object.entries(boneMapping)) {
                const bone = bonesRef[boneName];
                if (bone && keypoints[poseKey]) {
                    // Simple rotation based on position offset from original pose
                    const offsetX = keypoints[poseKey].x * 2;
                    const offsetY = keypoints[poseKey].y * 2;
                    
                    if (poseKey.includes('Elbow') || poseKey.includes('Wrist')) {
                        // Arms can rotate more
                        bone.rotation.z = offsetX * Math.PI * 0.5;
                        bone.rotation.x = offsetY * Math.PI * 0.5;
                    } else if (poseKey.includes('Shoulder')) {
                        bone.rotation.z = offsetX * Math.PI * 0.25;
                        bone.rotation.x = offsetY * Math.PI * 0.25;
                    } else if (poseKey.includes('Hip') || poseKey.includes('Knee')) {
                        bone.rotation.z = offsetX * Math.PI * 0.1;
                        bone.rotation.x = offsetY * Math.PI * 0.1;
                    }
                }
            }
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // Update reference model animations
            if (mixer) {
                mixer.update(delta);
            }
            
            // Render both scenes
            renderer.render(scene, camera);
            if (referenceRenderer && referenceScene && referenceCamera) {
                referenceRenderer.render(referenceScene, referenceCamera);
            }
        }
        
        // Initialize and start the application
        function init() {
            initScene();
            animate();
        }
        
        // Start the app
        init();
    </script>

</body>
</html>
