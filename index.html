<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Human Model Auto-Rigging</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #instructions {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 10;
        }
        #webcam {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 2px solid white;
            border-radius: 5px;
            z-index: 10;
        }
        progress {
            width: 80%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Auto-Rigging System...</h2>
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="loading-status">Initializing components...</p>
    </div>
    
    <div id="instructions">
        <h3>Auto-Rigging Demo</h3>
        <p>Stand in front of your camera and let PoseNet track your movements.</p>
        <p>The 3D model will automatically mirror your pose.</p>
    </div>
    
    <video id="webcam" playsinline></video>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js",
            "@tensorflow-models/posenet": "https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as tf from '@tensorflow/tfjs';
        
        // Global variables
        let scene, camera, renderer, controls;
        let model, skeleton, mixer, clock;
        let video, poseNet;
        let loadingManager, progressBar, loadingStatus;
        
        // Bone mapping between PoseNet and model
        const boneMapping = {
            nose: "mixamorigHead",
            leftShoulder: "mixamorigLeftShoulder",
            rightShoulder: "mixamorigRightShoulder",
            leftElbow: "mixamorigLeftArm",
            rightElbow: "mixamorigRightArm",
            leftWrist: "mixamorigLeftForeArm",
            rightWrist: "mixamorigRightForeArm",
            leftHip: "mixamorigLeftUpLeg",
            rightHip: "mixamorigRightUpLeg",
            leftKnee: "mixamorigLeftLeg",
            rightKnee: "mixamorigRightLeg",
            leftAnkle: "mixamorigLeftFoot",
            rightAnkle: "mixamorigRightFoot"
        };
        
        const bonesRef = {};
        
        // Loading manager for tracking loading progress
        loadingManager = new THREE.LoadingManager();
        progressBar = document.getElementById('progress-bar');
        loadingStatus = document.getElementById('loading-status');
        
        loadingManager.onProgress = function(url, loaded, total) {
            const progress = (loaded / total) * 100;
            progressBar.value = progress;
            loadingStatus.textContent = `Loading 3D model: ${Math.round(progress)}%`;
        };
        
        loadingManager.onLoad = function() {
            if (poseNetLoaded) {
                document.getElementById('loading').style.display = 'none';
            }
        };
        
        // Initialize Three.js scene
        function initScene() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x282c34);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(
                45, window.innerWidth / window.innerHeight, 0.1, 1000
            );
            camera.position.set(0, 1.5, 3);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1, 0);
            controls.update();
            
            // Clock for animations
            clock = new THREE.Clock();
            
            // Load default human model
            loadDefaultModel();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }
        
        // Load a default rigged human model
        function loadDefaultModel() {
            loadingStatus.textContent = "Loading 3D human model...";
            
            const loader = new GLTFLoader(loadingManager);
            
            // Using a default mixamo character as our rigged model
            // This URL points to a CC-licensed model hosted on GitHub for this demo
            const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Xbot.glb';
            
            loader.load(modelUrl, (gltf) => {
                model = gltf.scene;
                model.traverse(function(object) {
                    if (object.isMesh) {
                        object.castShadow = true;
                        object.receiveShadow = true;
                    }
                });
                
                // Store reference to skeleton
                skeleton = new THREE.SkeletonHelper(model);
                skeleton.visible = true;
                scene.add(skeleton);
                
                // Store references to bones for pose updating
                skeleton.bones.forEach(bone => {
                    bonesRef[bone.name] = bone;
                });
                
                // Set up animation mixer
                mixer = new THREE.AnimationMixer(model);
                if (gltf.animations.length) {
                    // Play default idle animation if available
                    const idleAction = mixer.clipAction(gltf.animations[0]);
                    idleAction.play();
                }
                
                // Center model
                const bbox = new THREE.Box3().setFromObject(model);
                const center = bbox.getCenter(new THREE.Vector3());
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;
                model.position.y = 0; // Set to ground
                
                // Add model to scene
                scene.add(model);
                
                // Set up webcam and PoseNet after model is loaded
                setupWebcam();
            }, 
            (xhr) => {
                // Progress handled by loadingManager
            },
            (error) => {
                console.error('Error loading model:', error);
                loadingStatus.textContent = "Error loading model. Please refresh the page.";
            });
        }
        
        // Set up webcam for pose detection
        function setupWebcam() {
            loadingStatus.textContent = "Setting up webcam...";
            
            video = document.getElementById('webcam');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                }).then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    
                    // Load PoseNet after webcam is ready
                    loadPoseNet();
                }).catch(function(error) {
                    console.error('Unable to access the camera:', error);
                    loadingStatus.textContent = "Camera access denied. Please allow camera access and refresh.";
                });
            } else {
                console.error('MediaDevices API not supported');
                loadingStatus.textContent = "Your browser doesn't support webcam access.";
            }
        }
        
        let poseNetLoaded = false;
        
        // Load PoseNet model
        async function loadPoseNet() {
            loadingStatus.textContent = "Loading pose detection model...";
            
            try {
                // First ensure TensorFlow.js is ready
                await tf.ready();
                
                // Then dynamically import and load PoseNet
                const posenetModule = await import('@tensorflow-models/posenet');
                poseNet = await posenetModule.default.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: { width: 320, height: 240 },
                    multiplier: 0.75,
                    quantBytes: 2
                });
                
                loadingStatus.textContent = "All components loaded!";
                poseNetLoaded = true;
                
                // Hide loading screen if model is also loaded
                if (loadingManager.isLoaded) {
                    document.getElementById('loading').style.display = 'none';
                }
                
                // Start pose detection
                detectPose();
            } catch (error) {
                console.error('Error loading PoseNet:', error);
                loadingStatus.textContent = "Error loading pose detection. Please refresh and ensure you have a stable internet connection.";
            }
        }
        
        // Run pose detection
        async function detectPose() {
            if (!poseNet || !video.readyState) {
                requestAnimationFrame(detectPose);
                return;
            }
            
            try {
                const pose = await poseNet.estimateSinglePose(video, {
                    flipHorizontal: true // Flip so the pose mirrors the user
                });
                
                // Update model pose if we have high confidence
                if (pose.score > 0.2) {
                    updateModelPose(pose);
                }
            } catch (error) {
                console.error('Error in pose detection:', error);
            }
            
            requestAnimationFrame(detectPose);
        }
        
        // Update the 3D model based on detected pose
        function updateModelPose(pose) {
            if (!model || !skeleton) return;
            
            // Normalize keypoints
            const keypoints = {};
            pose.keypoints.forEach(keypoint => {
                if (keypoint.score > 0.5) { // Only use high-confidence points
                    keypoints[keypoint.part] = {
                        x: keypoint.position.x / video.width - 0.5,
                        y: -(keypoint.position.y / video.height - 0.5)
                    };
                }
            });
            
            // Apply calculated rotations to model bones
            for (const [poseKey, boneName] of Object.entries(boneMapping)) {
                const bone = bonesRef[boneName];
                if (bone && keypoints[poseKey]) {
                    // This is a simplified approach - in a production system,
                    // you'd use inverse kinematics or more complex rotation calculations
                    // based on the relationships between multiple keypoints
                    
                    // Simple rotation based on position offset from original pose
                    const offsetX = keypoints[poseKey].x * 2;
                    const offsetY = keypoints[poseKey].y * 2;
                    
                    if (poseKey.includes('Elbow') || poseKey.includes('Wrist')) {
                        // Arms can rotate more
                        bone.rotation.z = offsetX * Math.PI * 0.5;
                        bone.rotation.x = offsetY * Math.PI * 0.5;
                    } else if (poseKey.includes('Shoulder')) {
                        bone.rotation.z = offsetX * Math.PI * 0.25;
                        bone.rotation.x = offsetY * Math.PI * 0.25;
                    } else if (poseKey.includes('Hip') || poseKey.includes('Knee')) {
                        bone.rotation.z = offsetX * Math.PI * 0.1;
                        bone.rotation.x = offsetY * Math.PI * 0.1;
                    }
                }
            }
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // Update mixer
            if (mixer) {
                mixer.update(delta);
            }
            
            renderer.render(scene, camera);
        }
        
        // Initialize and start the application
        function init() {
            initScene();
            animate();
        }
        
        // Start the app
        init();
    </script>

</body>
